<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    
    <title>海斗人格测试 - 海克斯大乱斗MBTI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes pulse-soft { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        .animate-pulse-soft { animation: pulse-soft 3s infinite ease-in-out; }
        @keyframes gradient-shift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .gradient-bg {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            background-size: 400% 400%;
            animation: gradient-shift 15s ease infinite;
        }
        .glass-effect {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .text-glow {
            text-shadow: 0 0 10px rgba(139, 92, 246, 0.8), 0 0 20px rgba(139, 92, 246, 0.6);
        }
        .card-hover:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 40px rgba(139, 92, 246, 0.3);
        }
        .loading-spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid rgba(139, 92, 246, 1);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="gradient-bg min-h-screen text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- 图标组件 ---
        const Icon = ({ name, size = 24, className = '' }) => {
            const svgProps = {
                xmlns: "http://www.w3.org/2000/svg", viewBox: "0 0 24 24", 
                fill: "none", stroke: "currentColor",
                strokeWidth: "2", strokeLinecap: "round", strokeLinejoin: "round", 
                className: className, style: { width: size, height: size }
            };
            switch (name) {
                case 'snowball': return <svg {...svgProps}><circle cx="12" cy="12" r="3"/><circle cx="18" cy="8" r="1.5"/><circle cx="6" cy="16" r="1"/><circle cx="8" cy="4" r="1"/></svg>;
                case 'sword': return <svg {...svgProps}><path d="M3 3l18 18"/><path d="M3 21l18-18"/><path d="M10 10l4 4"/><path d="M14 10l4 4"/></svg>;
                case 'shield': return <svg {...svgProps}><path d="M12 2l8 4v6c0 4.4-3.6 8-8 8s-8-3.6-8-8V6l8-4z"/></svg>;
                case 'target': return <svg {...svgProps}><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>;
                case 'smile': return <svg {...svgProps}><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>;
                case 'trophy': return <svg {...svgProps}><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 1.1-.9 2-2 2H6"/><path d="M14 14.66V17c0 1.1.9 2 2 2h2"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>;
                case 'rotate-ccw': return <svg {...svgProps}><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>;
                case 'download': return <svg {...svgProps}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>;
                default: return null;
            }
        };

        // --- 主应用组件 ---
        function App() {
            const [loading, setLoading] = useState(true);
            const [questionsData, setQuestionsData] = useState(null);
            const [personalityData, setPersonalityData] = useState(null);
            const [currentQuestion, setCurrentQuestion] = useState(0);
            const [answers, setAnswers] = useState({});
            const [showResult, setShowResult] = useState(false);
            const [result, setResult] = useState(null);
            const canvasRef = useRef(null);

            // 加载数据
            useEffect(() => {
                Promise.all([
                    fetch('data/questions.json').then(res => res.json()),
                    fetch('data/personality-prompts.json').then(res => res.json())
                ]).then(([questions, personalities]) => {
                    setQuestionsData(questions);
                    setPersonalityData(personalities);
                    setLoading(false);
                }).catch(err => {
                    console.error('加载数据失败:', err);
                    setLoading(false);
                });
            }, []);

            // 计算结果
            const calculateResult = useMemo(() => {
                if (!questionsData || Object.keys(answers).length < questionsData.totalQuestions) return null;

                const scores = {};
                questionsData.dimensions.forEach(dim => {
                    scores[dim.id] = { a: 0, b: 0 };
                });

                questionsData.questions.forEach(q => {
                    const answer = answers[q.id];
                    const option = q.options.find(opt => opt.key === answer);
                    if (option && option.tendency !== 'neutral') {
                        scores[q.dimension][option.tendency.toLowerCase()] += option.score;
                    }
                });

                const typeKey = Object.entries(scores)
                    .sort((a, b) => a[0] - b[0])
                    .map(([key, val]) => val.a >= val.b ? 'A' : 'B')
                    .join('');

                const radarData = Object.values(scores).map(val => 
                    Math.max(val.a, val.b)
                );

                return { typeKey, scores, radarData };
            }, [answers, questionsData]);

            // 显示结果
            useEffect(() => {
                if (calculateResult && showResult && personalityData) {
                    // 找到匹配的人格类型
                    const personality = personalityData.personalities.find(p => p.code === calculateResult.typeKey);
                    if (personality) {
                        setResult({ ...calculateResult, personality });
                    }
                }
            }, [calculateResult, showResult, personalityData]);

            // 绘制雷达图
            useEffect(() => {
                if (showResult && result && canvasRef.current && questionsData) {
                    const ctx = canvasRef.current.getContext('2d');
                    const centerX = canvasRef.current.width / 2;
                    const centerY = canvasRef.current.height / 2;
                    const radius = Math.min(centerX, centerY) - 30;
                    const sides = 5;

                    // 清空画布
                    ctx.clearRect(0, 0, canvasRef.current.width, canvasRef.current.height);

                    // 绘制背景网格
                    for (let level = 1; level <= 3; level++) {
                        const levelRadius = (radius / 3) * level;
                        ctx.beginPath();
                        for (let i = 0; i <= sides; i++) {
                            const angle = (i * 2 * Math.PI / sides) - Math.PI / 2;
                            const x = centerX + levelRadius * Math.cos(angle);
                            const y = centerY + levelRadius * Math.sin(angle);
                            if (i === 0) ctx.moveTo(x, y);
                            else ctx.lineTo(x, y);
                        }
                        ctx.closePath();
                        ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
                        ctx.stroke();
                    }

                    // 绘制轴线和标签
                    const labels = questionsData.dimensions.map(dim => 
                        dim.tendencyA.substring(0, 2)
                    );
                    for (let i = 0; i < sides; i++) {
                        const angle = (i * 2 * Math.PI / sides) - Math.PI / 2;
                        const x = centerX + radius * Math.cos(angle);
                        const y = centerY + radius * Math.sin(angle);
                        
                        ctx.beginPath();
                        ctx.moveTo(centerX, centerY);
                        ctx.lineTo(x, y);
                        ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                        ctx.stroke();

                        // 标签
                        const labelX = centerX + (radius + 20) * Math.cos(angle);
                        const labelY = centerY + (radius + 20) * Math.sin(angle);
                        ctx.fillStyle = '#ffffff';
                        ctx.font = '12px sans-serif';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText(labels[i], labelX, labelY);
                    }

                    // 绘制数据区域
                    ctx.beginPath();
                    for (let i = 0; i < sides; i++) {
                        const value = result.radarData[i];
                        const level = value / questionsData.scoringRules.maxScorePerDimension;
                        const angle = (i * 2 * Math.PI / sides) - Math.PI / 2;
                        const x = centerX + (radius * level) * Math.cos(angle);
                        const y = centerY + (radius * level) * Math.sin(angle);
                        
                        if (i === 0) ctx.moveTo(x, y);
                        else ctx.lineTo(x, y);
                    }
                    ctx.closePath();
                    ctx.fillStyle = 'rgba(139, 92, 246, 0.3)';
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(139, 92, 246, 1)';
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    // 绘制数据点
                    for (let i = 0; i < sides; i++) {
                        const value = result.radarData[i];
                        const level = value / questionsData.scoringRules.maxScorePerDimension;
                        const angle = (i * 2 * Math.PI / sides) - Math.PI / 2;
                        const x = centerX + (radius * level) * Math.cos(angle);
                        const y = centerY + (radius * level) * Math.sin(angle);
                        
                        ctx.beginPath();
                        ctx.arc(x, y, 5, 0, 2 * Math.PI);
                        ctx.fillStyle = 'rgba(139, 92, 246, 1)';
                        ctx.fill();
                    }
                }
            }, [showResult, result, questionsData]);

            // 加载中
            if (loading) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-4">
                        <div className="loading-spinner mb-4"></div>
                        <p className="text-xl text-purple-200">加载测试数据...</p>
                    </div>
                );
            }

            // 首页
            if (!showResult && currentQuestion === 0) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-4">
                        <div className="max-w-2xl w-full text-center">
                            <div className="mb-8">
                                <h1 className="text-5xl md:text-6xl font-bold mb-4 text-glow">
                                    海斗人格测试
                                </h1>
                                <p className="text-xl md:text-2xl text-purple-200">
                                    海克斯大乱斗MBTI性格测试
                                </p>
                                <p className="text-lg text-purple-300 mt-4">
                                    测测你是乱斗哪种牛马 🎮
                                </p>
                            </div>

                            <div className="glass-effect rounded-2xl p-8 mb-8">
                                <div className="grid grid-cols-5 gap-4 mb-8">
                                    {questionsData.dimensions.map((dim, idx) => (
                                        <div key={dim.id} className="text-center">
                                            <div className="text-2xl mb-2">
                                                {dim.emojiA}{dim.emojiB}
                                            </div>
                                            <div className="text-sm text-purple-200">{dim.tendencyA}</div>
                                            <div className="text-xs text-gray-400">vs</div>
                                            <div className="text-sm text-purple-200">{dim.tendencyB}</div>
                                        </div>
                                    ))}
                                </div>
                                <p className="text-gray-300 mb-6">
                                    基于MBTI二分法，通过{questionsData.totalQuestions}道趣味测试题，精准分析你的大乱斗玩法风格
                                </p>
                                <button 
                                    onClick={() => setCurrentQuestion(1)}
                                    className="bg-purple-600 hover:bg-purple-700 text-white font-bold py-4 px-12 rounded-full text-xl transition-all duration-300 transform hover:scale-105 shadow-lg hover:shadow-purple-500/50"
                                >
                                    开始测试
                                </button>
                            </div>

                            <p className="text-sm text-gray-400">
                                ⚡ 耗时约2分钟 | 🎯 纯娱乐测试 | 📊 {questionsData.dimensions.length}个维度 × 2种倾向 = 32种人格
                            </p>
                        </div>
                    </div>
                );
            }

            // 答题页
            if (!showResult && currentQuestion > 0 && questionsData) {
                const questionIndex = currentQuestion - 1;
                const question = questionsData.questions[questionIndex];
                const dimension = questionsData.dimensions.find(d => d.id === question.dimension);
                const progress = (questionIndex / questionsData.totalQuestions) * 100;

                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-4">
                        <div className="max-w-3xl w-full">
                            {/* 进度条 */}
                            <div className="mb-8">
                                <div className="flex justify-between text-sm text-purple-200 mb-2">
                                    <span>进度</span>
                                    <span>{currentQuestion} / {questionsData.totalQuestions}</span>
                                </div>
                                <div className="h-2 bg-purple-900/50 rounded-full overflow-hidden">
                                    <div 
                                        className="h-full bg-gradient-to-r from-purple-600 to-pink-600 transition-all duration-500"
                                        style={{ width: `${progress}%` }}
                                    ></div>
                                </div>
                            </div>

                            {/* 问题卡片 */}
                            <div className="glass-effect rounded-2xl p-6 md:p-8 mb-6 card-hover transition-all duration-300 overflow-hidden">
                                <div className="flex items-center mb-4 md:mb-6">
                                    <div className="text-2xl mr-4">
                                        {dimension.emojiA}{dimension.emojiB}
                                    </div>
                                    <span className="text-purple-200 text-lg">
                                        {dimension.tendencyA} vs {dimension.tendencyB}
                                    </span>
                                </div>

                                <h2 className="text-xl md:text-2xl lg:text-3xl font-bold mb-6 md:mb-8 text-white">
                                    {question.question}
                                </h2>

                                <div className="flex flex-col sm:flex-row gap-3 md:gap-4 justify-center">
                                    {question.options.map((option) => (
                                        <button
                                            key={option.key}
                                            onClick={() => {
                                                setAnswers(prev => ({ ...prev, [question.id]: option.key }));
                                                if (currentQuestion < questionsData.totalQuestions) {
                                                    setCurrentQuestion(currentQuestion + 1);
                                                } else {
                                                    setShowResult(true);
                                                }
                                            }}
                                            className="flex-1 min-w-[200px] sm:min-w-[180px] p-4 md:p-5 rounded-xl bg-gradient-to-br from-purple-900/50 to-purple-800/30 hover:from-purple-800/50 hover:to-purple-700/30 border-2 border-purple-600/30 hover:border-purple-500/60 transition-all duration-300 transform hover:scale-105 hover:-translate-y-1 shadow-lg hover:shadow-purple-500/30"
                                        >
                                            <div className="flex flex-col items-center text-center h-full">
                                                <div className="w-10 h-10 md:w-12 md:h-12 rounded-full bg-purple-600/50 flex items-center justify-center mb-3 md:mb-4">
                                                    <span className="text-purple-200 font-bold text-lg md:text-xl">
                                                        {option.key}
                                                    </span>
                                                </div>
                                                <span className="text-white text-sm md:text-base leading-relaxed">
                                                    {option.text}
                                                </span>
                                            </div>
                                        </button>
                                    ))}
                                </div>
                            </div>

                            {/* 返回按钮 */}
                            {currentQuestion > 1 && (
                                <button
                                    onClick={() => setCurrentQuestion(currentQuestion - 1)}
                                    className="flex items-center text-purple-300 hover:text-purple-200 transition-colors"
                                >
                                    <Icon name="rotate-ccw" size={20} className="mr-2" />
                                    返回上一题
                                </button>
                            )}
                        </div>
                    </div>
                );
            }

            // 结果页
            if (showResult && result && personalityData) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-4">
                        <div className="max-w-4xl w-full">
                            {/* 人格标题 */}
                            <div className="text-center mb-8">
                                <div className="text-4xl mb-4">{result.personality.emojis}</div>
                                <h1 className="text-4xl md:text-5xl font-bold mb-4 text-glow">
                                    {result.personality.name}
                                </h1>
                                <p className="text-lg text-purple-200 mb-6">
                                    {result.personality.description}
                                </p>
                            </div>

                            {/* 结果卡片 */}
                            <div className="glass-effect rounded-2xl p-8 mb-6">
                                <div className="grid md:grid-cols-2 gap-8">
                                    {/* 雷达图 */}
                                    <div className="flex flex-col items-center">
                                        <h3 className="text-xl font-bold mb-4 text-purple-200">
                                            你的乱斗雷达图
                                        </h3>
                                        <div className="bg-purple-900/30 rounded-xl p-4">
                                            <canvas 
                                                ref={canvasRef} 
                                                width={300} 
                                                height={300}
                                                className="max-w-full"
                                            />
                                        </div>
                                    </div>

                                    {/* 详细信息 */}
                                    <div className="space-y-6">
                                        <div>
                                            <h3 className="text-xl font-bold mb-3 text-purple-200">
                                                行为画像
                                            </h3>
                                            <p className="text-gray-300 leading-relaxed">
                                                {result.personality.description}
                                            </p>
                                        </div>

                                        <div>
                                            <h3 className="text-xl font-bold mb-3 text-purple-200">
                                                典型操作
                                            </h3>
                                            <div className="bg-purple-900/30 rounded-lg p-4 border-l-4 border-purple-500">
                                                <p className="text-white italic">
                                                    "{result.personality.typicalAction}"
                                                </p>
                                            </div>
                                        </div>

                                        <div>
                                            <h3 className="text-xl font-bold mb-3 text-purple-200">
                                                经典台词
                                            </h3>
                                            <div className="bg-purple-900/30 rounded-lg p-4 border-l-4 border-pink-500">
                                                <p className="text-white italic font-semibold">
                                                    {result.personality.classicQuote}
                                                </p>
                                            </div>
                                        </div>

                                        <div>
                                            <h3 className="text-xl font-bold mb-3 text-purple-200">
                                                符文搭配
                                            </h3>
                                            <div className="bg-purple-900/30 rounded-lg p-4 border-l-4 border-yellow-500">
                                                <p className="text-yellow-300 font-semibold">
                                                    {result.personality.runeBuild}
                                                </p>
                                            </div>
                                        </div>

                                        <div>
                                            <h3 className="text-xl font-bold mb-3 text-purple-200">
                                                性格标签
                                            </h3>
                                            <div className="flex flex-wrap gap-2">
                                                <span className="bg-purple-800/50 text-white px-3 py-1 rounded-lg text-sm">
                                                    心情: {result.personality.mood}
                                                </span>
                                                <span className="bg-purple-800/50 text-white px-3 py-1 rounded-lg text-sm">
                                                    代表英雄: {result.personality.hero}
                                                </span>
                                            </div>
                                        </div>

                                        <div>
                                            <h3 className="text-xl font-bold mb-3 text-purple-200">
                                                维度分析
                                            </h3>
                                            <div className="space-y-2">
                                                {questionsData.dimensions.map((dim, idx) => (
                                                    <div key={dim.id} className="flex justify-between text-sm">
                                                        <span className="text-purple-300">
                                                            {dim.emojiA} {dim.tendencyA} vs {dim.tendencyB} {dim.emojiB}
                                                        </span>
                                                        <span className="text-white">
                                                            {result.scores[dim.id].a} - {result.scores[dim.id].b}
                                                        </span>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* 操作按钮 */}
                            <div className="flex flex-col sm:flex-row gap-4 justify-center">
                                <button
                                    onClick={() => {
                                        setCurrentQuestion(0);
                                        setAnswers({});
                                        setShowResult(false);
                                        setResult(null);
                                    }}
                                    className="flex items-center justify-center bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-8 rounded-full transition-all duration-300 transform hover:scale-105"
                                >
                                    <Icon name="rotate-ccw" size={20} className="mr-2" />
                                    重新测试
                                </button>

                                <button
                                    onClick={() => {
                                        const canvas = canvasRef.current;
                                        if (canvas) {
                                            const link = document.createElement('a');
                                            link.download = `海斗人格测试-${result.personality.name}.png`;
                                            link.href = canvas.toDataURL();
                                            link.click();
                                        }
                                    }}
                                    className="flex items-center justify-center bg-purple-800 hover:bg-purple-900 text-white font-bold py-3 px-8 rounded-full transition-all duration-300 transform hover:scale-105"
                                >
                                    <Icon name="download" size={20} className="mr-2" />
                                    保存结果
                                </button>
                            </div>

                            <p className="text-center text-sm text-gray-400 mt-8">
                                💜 海斗人格测试 - 纯娱乐性质，请勿认真 💜
                            </p>
                        </div>
                    </div>
                );
            }

            return null;
        }

        // 渲染应用
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
