                    snowball: { a: 0, b: 0 },
                    skill: { a: 0, b: 0 },
                    risk: { a: 0, b: 0 },
                    distance: { a: 0, b: 0 },
                    mindset: { a: 0, b: 0 }
                };

                questions.forEach(q => {
                    const answer = answers[q.id];
                    if (answer === 'A') scores[q.category].a++;
                    else if (answer === 'B') scores[q.category].b++;
                });

                const typeKey = Object.entries(scores)
                    .map(([key, val]) => val.a >= val.b ? 'A' : 'B')
                    .join('');

                const radarData = Object.values(scores).map(val => 
                    Math.max(val.a, val.b)
                );

                return { typeKey, scores, radarData };
            }, [answers]);

            useEffect(() => {

                }

                    const centerY = canvasRef.current.height / 2;
                    const radius = Math.min(centerX, centerY) - 30;
                    const sides = 5;

                    // 清空画布
                    ctx.clearRect(0, 0, canvasRef.current.width, canvasRef.current.height);

                    // 绘制背景网格
                    for (let level = 1; level <= 3; level++) {
                        const levelRadius = (radius / 3) * level;
                        ctx.beginPath();
                        for (let i = 0; i <= sides; i++) {
                            const angle = (i * 2 * Math.PI / sides) - Math.PI / 2;
                            const x = centerX + levelRadius * Math.cos(angle);
                            const y = centerY + levelRadius * Math.sin(angle);
                            if (i === 0) ctx.moveTo(x, y);
                            else ctx.lineTo(x, y);
                        }
                        ctx.closePath();
                        ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';

                        const y = centerY + radius * Math.sin(angle);
                        
                        ctx.beginPath();
                        ctx.moveTo(centerX, centerY);
                        ctx.lineTo(x, y);
                        ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                        ctx.stroke();

                        // 标签
                        const labelX = centerX + (radius + 20) * Math.cos(angle);
                        const labelY = centerY + (radius + 20) * Math.sin(angle);
                        ctx.fillStyle = '#ffffff';
                        ctx.font = '12px sans-serif';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText(labels[i], labelX, labelY);
                    }

                    ctx.beginPath();
                    for (let i = 0; i < sides; i++) {
                        const value = result.radarData[i];
                        const level = value / 3;
                        const angle = (i * 2 * Math.PI / sides) - Math.PI / 2;
                        const x = centerX + (radius * level) * Math.cos(angle);
                        const y = centerY + (radius * level) * Math.sin(angle);
                        
                        if (i === 0) ctx.moveTo(x, y);
                        else ctx.lineTo(x, y);
                    }
                    ctx.closePath();
                    ctx.fillStyle = 'rgba(139, 92, 246, 0.3)';
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(139, 92, 246, 1)';
                    ctx.lineWidth = 2;
                    ctx.stroke();

                        const value = result.radarData[i];

                        const x = centerX + (radius * level) * Math.cos(angle);
                        const y = centerY + (radius * level) * Math.sin(angle);
                        
                        ctx.beginPath();
                        ctx.arc(x, y, 5, 0, 2 * Math.PI);
                        ctx.fillStyle = 'rgba(139, 92, 246, 1)';
                        ctx.fill();
                    }

                    <div className="min-h-screen flex flex-col items-center justify-center p-4">
                        <div className="max-w-4xl w-full">
                            {/* 人格标题 */}
                            <div className="text-center mb-8">
                                <h1 className="text-4xl md:text-5xl font-bold mb-4 text-glow">
                                    {result.personality.name}
                                </h1>
                                <div className="flex flex-wrap justify-center gap-2 mb-6">
                                    {result.personality.tags.map((tag, idx) => (
                                        <span 
                                            key={idx}
                                            className="bg-purple-600/50 text-white px-4 py-2 rounded-full text-sm"
                                        >
                                            {tag}
                                        </span>
                                    ))}
                                </div>
                            </div>

                            {/* 结果卡片 */}
                            <div className="glass-effect rounded-2xl p-8 mb-6">
                                <div className="grid md:grid-cols-2 gap-8">
                                    {/* 雷达图 */}
                                    <div className="flex flex-col items-center">
                                        <h3 className="text-xl font-bold mb-4 text-purple-200">
                                            你的乱斗雷达图
                                        </h3>
                                        <div className="bg-purple-900/30 rounded-xl p-4">
                                            <canvas 
                                                ref={canvasRef} 
                                                width={300} 
                                                height={300}
                                                className="max-w-full"
                                            />
                                        </div>
                                    </div>

                                    {/* 详细信息 */}
                                    <div className="space-y-6">
                                        <div>
                                            <h3 className="text-xl font-bold mb-3 text-purple-200">
                                                行为画像
                                            </h3>
                                            <p className="text-gray-300 leading-relaxed">
                                                {result.personality.description}
                                            </p>
                                        </div>

                                        <div>
                                            <h3 className="text-xl font-bold mb-3 text-purple-200">
                                                本命英雄
                                            </h3>
                                            <div className="flex flex-wrap gap-2">
                                                {result.personality.heroes.map((hero, idx) => (
                                                    <span 
                                                        key={idx}
                                                        className="bg-purple-800/50 text-white px-3 py-1 rounded-lg text-sm"
                                                    >
                                                        {hero}
                                                    </span>
                                                ))}
                                            </div>
                                        </div>

                                        <div>
                                            <h3 className="text-xl font-bold mb-3 text-purple-200">
                                                维度分析
                                            </h3>
                                            <div className="space-y-2">
                                                {Object.entries(result.scores).map(([key, score]) => (
                                                    <div key={key} className="flex justify-between text-sm">
                                                        <span className="text-purple-300">
                                                            {dimensionNames[key].a} vs {dimensionNames[key].b}
                                                        </span>
                                                        <span className="text-white">
                                                            {score.a} - {score.b}
                                                        </span>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* 操作按钮 */}
                            <div className="flex flex-col sm:flex-row gap-4 justify-center">
                                <button
                                    onClick={() => {
                                        setCurrentQuestion(0);
                                        setAnswers({});
                                        setShowResult(false);
                                        setResult(null);
                                    }}
                                    className="flex items-center justify-center bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-8 rounded-full transition-all duration-300 transform hover:scale-105"
                                >
                                    <Icon name="rotate-ccw" size={20} className="mr-2" />
                                    重新测试
                                </button>

                                <button
                                    onClick={() => {
                                        // 保存图片功能
                                        const canvas = canvasRef.current;
                                        if (canvas) {
                                            const link = document.createElement('a');
                                            link.download = `海斗人格测试-${result.personality.name}.png`;
                                            link.href = canvas.toDataURL();
                                            link.click();
                                        }
                                    }}
                                    className="flex items-center justify-center bg-purple-800 hover:bg-purple-900 text-white font-bold py-3 px-8 rounded-full transition-all duration-300 transform hover:scale-105"
                                >
                                    <Icon name="download" size={20} className="mr-2" />
                                    保存结果
                                </button>
                            </div>

                            <p className="text-center text-sm text-gray-400 mt-8">
                                💜 海斗人格测试 - 纯娱乐性质，请勿认真 💜
                            </p>
                        </div>
                    </div>
                );
            }

            return null;
        }

        // 渲染应用
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
